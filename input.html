<!DOCTYPE html>
<html lang="de">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Score Eingabe</title>


    <!--
        SheetJS liest die Excel-Datei im Browser.
    -->

    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            font-family:
                Arial,
                sans-serif;

            background: #f3f3f3;

            color: #111;

        }


        .input-page {

            width: 100%;

            max-width: 600px;

            margin: 0 auto;

            padding: 16px;

        }


        /* =====================================
           KOPF
           ===================================== */

        .input-title {

            margin-bottom: 15px;

        }


        .input-title h1 {

            margin: 0;

            font-size: 27px;

        }


        .input-title p {

            margin: 5px 0 0;

            color: #666;

        }


        /* =====================================
           LOCH-NAVIGATION
           ===================================== */

        .hole-navigation {

            display: grid;

            grid-template-columns: 48px 1fr 48px;

            gap: 8px;

            align-items: center;

            margin-bottom: 12px;

        }


        .navigation-button {

            height: 48px;

            border: none;

            border-radius: 9px;

            background: #ddd;

            font-size: 24px;

            cursor: pointer;

        }


        .hole-select {

            width: 100%;

            height: 48px;

            padding: 0 10px;

            border: 1px solid #ccc;

            border-radius: 9px;

            background: white;

            font-size: 16px;

        }


        /* =====================================
           PAR
           ===================================== */

        .par-display {

            text-align: center;

            margin-bottom: 15px;

            padding: 10px;

            background: white;

            border-radius: 10px;

            box-shadow:
                0 2px 8px rgba(0, 0, 0, 0.06);

        }


        .par-label {

            font-size: 12px;

            color: #777;

            text-transform: uppercase;

            letter-spacing: 1px;

        }


        .par-value {

            margin-top: 2px;

            font-size: 28px;

            font-weight: bold;

        }


        /* =====================================
           SPIELER
           ===================================== */

        .players-card {

            background: white;

            border-radius: 14px;

            padding: 8px 16px;

            box-shadow:
                0 3px 12px rgba(0, 0, 0, 0.08);

        }


        .player-row {

            display: grid;

            grid-template-columns: 1fr auto;

            align-items: center;

            gap: 12px;

            min-height: 72px;

            border-bottom: 1px solid #eee;

        }


        .player-row:last-child {

            border-bottom: none;

        }


        .player-name {

            font-size: 16px;

            font-weight: bold;

        }


        .player-controls {

            display: flex;

            align-items: center;

            gap: 7px;

        }


        .score-button {

            width: 42px;

            height: 42px;

            border: none;

            border-radius: 8px;

            background: #ddd;

            font-size: 22px;

            cursor: pointer;

        }


        .score-input {

            width: 48px;

            height: 42px;

            padding: 0;

            border: 1px solid #ccc;

            border-radius: 8px;

            text-align: center;

            font-size: 18px;

            font-weight: bold;

        }


        /* =====================================
           SPEICHERN
           ===================================== */

        .save-button {

            width: 100%;

            height: 54px;

            margin-top: 16px;

            border: none;

            border-radius: 9px;

            background: #111;

            color: white;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;

        }
/* =====================================
           reset
           ===================================== */

        .reset-button {

    width: 100%;

    height: 48px;

    margin-top: 10px;

    border: none;

    border-radius: 9px;

    background: #c62828;

    color: white;

    font-size: 15px;

    font-weight: bold;

    cursor: pointer;

}


        /* =====================================
           STATUS
           ===================================== */

        .status {

            display: none;

            margin-top: 12px;

            padding: 12px;

            border-radius: 8px;

            background: #eee;

            font-size: 14px;

        }


        /* =====================================
           MOBILE
           ===================================== */

        @media (max-width: 420px) {

            .input-page {

                padding: 12px;

            }


            .player-name {

                font-size: 14px;

            }


            .score-button {

                width: 40px;

                height: 40px;

            }


            .score-input {

                width: 44px;

                height: 40px;

            }

        }

    </style>

</head>


<body>


<main class="input-page">


    <div class="input-title">

        <h1>Score Eingabe</h1>

        <p>
            Turnier · Scorekarte
        </p>

    </div>


    <!-- =====================================
         LOCH-AUSWAHL
         ===================================== -->

    <div class="hole-navigation">


        <button
            type="button"
            class="navigation-button"
            id="previous-hole"
        >
            ‹
        </button>


        <select
            class="hole-select"
            id="hole-select"
        >
        </select>


        <button
            type="button"
            class="navigation-button"
            id="next-hole"
        >
            ›
        </button>


    </div>


    <!-- =====================================
         PAR
         ===================================== -->

    <div class="par-display">

        <div class="par-label">
            Par
        </div>

        <div
            class="par-value"
            id="par-value"
        >
            –
        </div>

    </div>


    <!-- =====================================
         SPIELER
         ===================================== -->

    <section class="players-card">


        <div class="player-row">


            <div class="player-name">
                Ludwig LENZ
            </div>


            <div class="player-controls">

                <button
                    type="button"
                    class="score-button"
                    data-player="Lenz"
                    data-action="minus"
                >
                    −
                </button>


                <input
                    type="number"
                    class="score-input"
                    id="score-Lenz"
                    min="1"
                    max="20"
                >


                <button
                    type="button"
                    class="score-button"
                    data-player="Lenz"
                    data-action="plus"
                >
                    +
                </button>

            </div>

        </div>


        <div class="player-row">


            <div class="player-name">
                Andreas SCHLEHHUBER
            </div>


            <div class="player-controls">

                <button
                    type="button"
                    class="score-button"
                    data-player="Schlehhuber"
                    data-action="minus"
                >
                    −
                </button>


                <input
                    type="number"
                    class="score-input"
                    id="score-Schlehhuber"
                    min="1"
                    max="20"
                >


                <button
                    type="button"
                    class="score-button"
                    data-player="Schlehhuber"
                    data-action="plus"
                >
                    +
                </button>

            </div>

        </div>


        <div class="player-row">


            <div class="player-name">
                Peter RASER
            </div>


            <div class="player-controls">

                <button
                    type="button"
                    class="score-button"
                    data-player="Raser"
                    data-action="minus"
                >
                    −
                </button>


                <input
                    type="number"
                    class="score-input"
                    id="score-Raser"
                    min="1"
                    max="20"
                >


                <button
                    type="button"
                    class="score-button"
                    data-player="Raser"
                    data-action="plus"
                >
                    +
                </button>

            </div>

        </div>


    </section>


    <button
        type="button"
        class="save-button"
        id="save"
    >
        SCHLÄGE SPEICHERN
    </button>

    <button
    type="button"
    class="reset-button"
    id="reset-tournament"
>
        TURNIER ZURÜCKSETZEN
    </button>

    <div
        class="status"
        id="status"
    ></div>


</main>


<script>


// =========================================
// KONFIGURATION
// =========================================

// Excel-Datei im selben Verzeichnis

const excelFile =
    "scorekarte_leaderboard.xlsx";


// Neuer Speicher für tatsächlich
// eingegebene Schläge.
//
// Wichtig:
// Der alte "golfHoleData"-Speicher wird
// absichtlich NICHT mehr verwendet.

const STORAGE_KEY =
    "golfPlayedScores";

// =========================================
// SUPABASE
// =========================================

const SUPABASE_URL =
    "https://pdwgmbheawyulnxvzzzb.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_Fw5AztwZqtUJfQMFJTWvvA_aqH-83hG";

let supabaseClient = null;


function initializeSupabase() {

    if (
        typeof supabase === "undefined"
    ) {

        console.error(
            "Supabase-Bibliothek wurde nicht geladen."
        );

        return false;

    }


    supabaseClient =
        supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


    console.log(
        "Supabase-Verbindung hergestellt."
    );
    
    console.log(
    "Supabase Client:",
    supabaseClient
);

console.log(
    "Supabase URL:",
    SUPABASE_URL
);

console.log(
    "Supabase Key beginnt mit:",
    SUPABASE_KEY.substring(0, 15)
);

    return true;

}
    
// =========================================
// RUNDEN
// =========================================

const roundStartRows = {

    1: 1,
    2: 34,
    3: 67,
    4: 100

};


// =========================================
// SPIELER / EXCEL-SPALTEN
// =========================================
//
// PAR wird aus Excel gelesen.
//
// shots wird hier NICHT mehr aus Excel
// gelesen. Die Schläge kommen ausschließlich
// aus der Eingabemaske.
//

const playerColumns = {

    Lenz: {
        par: 4
    },

    Schlehhuber: {
        par: 13
    },

    Raser: {
        par: 22
    }

};


// =========================================
// DATEN
// =========================================

let workbook = null;

let holeData = {};

let playedScores = {};

let currentHoleIndex = 0;


// =========================================
// 72 LÖCHER ERZEUGEN
// =========================================

const holes = [];


for (
    let round = 1;
    round <= 4;
    round++
) {

    for (
        let hole = 1;
        hole <= 18;
        hole++
    ) {

        holes.push({

            round: round,

            hole: hole,

            label:
                `Runde ${round} – Loch ${hole}`

        });

    }

}


// =========================================
// DROPDOWN
// =========================================

const holeSelect =
    document.getElementById(
        "hole-select"
    );


holes.forEach(
    (hole, index) => {

        const option =
            document.createElement(
                "option"
            );


        option.value =
            index;


        option.textContent =
            hole.label;


        holeSelect.appendChild(
            option
        );

    }
);


// =========================================
// GESPEICHERTE SCHLÄGE LADEN
// =========================================
//
// Hier werden ausschließlich Werte
// geladen, die über die Eingabemaske
// gespeichert wurden.
//

function loadPlayedScores() {

    const saved =
        localStorage.getItem(
            STORAGE_KEY
        );


    if (!saved) {

        return {};

    }


    try {

        const data =
            JSON.parse(saved);


        if (
            typeof data !== "object" ||
            data === null
        ) {

            return {};

        }


        return data;

    } catch (error) {

        console.error(
            "Gespeicherte Schläge konnten nicht geladen werden.",
            error
        );


        return {};

    }

}


// =========================================
// EXCEL LADEN
// =========================================

async function loadExcel() {

    try {

        const response =
            await fetch(
                excelFile
            );


        if (!response.ok) {

            throw new Error(
                "Excel-Datei konnte nicht geladen werden."
            );

        }


        const arrayBuffer =
            await response.arrayBuffer();


        workbook =
            XLSX.read(
                arrayBuffer,
                {
                    type: "array"
                }
            );


        readExcelData();


        // Jetzt erst die tatsächlich
        // gespeicherten Schläge laden.

        playedScores =
            loadPlayedScores();


        showHole(0);


        showStatus(
            "Excel-Datei erfolgreich geladen.",
            false
        );


    } catch (error) {

        console.error(error);


        showStatus(
            "Die Excel-Datei konnte nicht geladen werden. " +
            "Bitte die Seite über Live Server öffnen.",
            true
        );

    }

}


// =========================================
// EXCEL-DATEN AUSLESEN
// =========================================
//
// Hier lesen wir NUR das PAR.
//
// Keine Schlagzahl aus Excel wird
// als gespielt übernommen.
//

function readExcelData() {

    const sheet =
        workbook.Sheets["3-Spieler"];


    if (!sheet) {

        throw new Error(
            'Das Tabellenblatt "3-Spieler" wurde nicht gefunden.'
        );

    }


    for (
        const hole of holes
    ) {

        const startRow =
            roundStartRows[
                hole.round
            ];


        const excelRow =
            startRow +
             8 +
            hole.hole;


        const key =
            `${hole.round}_${hole.hole}`;


        holeData[key] = {

            round:
                hole.round,

            hole:
                hole.hole,

            par: {}

        };


        for (
            const player
            of Object.keys(playerColumns)
        ) {

            const columns =
                playerColumns[player];


            const parCell =
                sheet[
                    XLSX.utils.encode_cell({

                        r:
                            excelRow - 1,

                        c:
                            columns.par - 1

                    })
                ];


            holeData[key].par[player] =
                getCellNumber(
                    parCell
                );

        }

    }

}


// =========================================
// ZAHL AUS EXCEL-ZELLE
// =========================================

function getCellNumber(cell) {

    if (!cell) {

        return null;

    }


    const value =
        cell.v;


    if (
        value === undefined ||
        value === null ||
        value === ""
    ) {

        return null;

    }


    const number =
        Number(value);


    return Number.isFinite(number)
        ? number
        : null;

}


// =========================================
// SCORE-SCHLÜSSEL
// =========================================

function getScoreKey(
    round,
    hole,
    player
) {

    return (
        `${round}_${hole}_${player}`
    );

}


// =========================================
// GESPEICHERTEN SCORE HOLEN
// =========================================

function getPlayedScore(
    round,
    hole,
    player
) {

    const key =
        getScoreKey(
            round,
            hole,
            player
        );


    const value =
        playedScores[key];


    if (
        value === undefined ||
        value === null
    ) {

        return null;

    }


    const number =
        Number(value);


    if (!Number.isFinite(number)) {

        return null;

    }


    return number;

}


// =========================================
// AKTUELLES LOCH ANZEIGEN
// =========================================

function showHole(index) {

    if (index < 0) {

        index = 0;

    }


    if (index >= holes.length) {

        index =
            holes.length - 1;

    }


    currentHoleIndex =
        index;


    holeSelect.value =
        currentHoleIndex;


    const hole =
        holes[
            currentHoleIndex
        ];


    const key =
        `${hole.round}_${hole.hole}`;


    const data =
        holeData[key];


    if (!data) {

        return;

    }


    // =====================================
    // PAR
    // =====================================

    const parValues =
        Object.values(
            data.par
        )
        .filter(
            value =>
                value !== null
        );


    const par =
        parValues.length > 0
            ? parValues[0]
            : null;


    document
        .getElementById("par-value")
        .textContent =
            par !== null
                ? par
                : "–";


    // =====================================
    // SPIELER
    // =====================================

    for (
        const player
        of Object.keys(playerColumns)
    ) {

        const input =
            document.getElementById(
                `score-${player}`
            );


        const savedScore =
            getPlayedScore(
                hole.round,
                hole.hole,
                player
            );


        // Wenn bereits gespielt:
        // gespeicherten Score anzeigen.

        if (
            savedScore !== null
        ) {

            input.value =
                savedScore;

        }

        // Wenn noch nicht gespielt:
        // PAR als Startwert anzeigen.

        else if (
            par !== null
        ) {

            input.value =
                par;

        }

        else {

            input.value =
                "";

        }

    }

}


// =========================================
// LOCH AUS DROPDOWN
// =========================================

holeSelect.addEventListener(
    "change",
    () => {

        showHole(
            Number(
                holeSelect.value
            )
        );

    }
);


// =========================================
// VORHERIGES LOCH
// =========================================

document
    .getElementById(
        "previous-hole"
    )
    .addEventListener(
        "click",
        () => {

            showHole(
                currentHoleIndex - 1
            );

        }
    );


// =========================================
// NÄCHSTES LOCH
// =========================================

document
    .getElementById(
        "next-hole"
    )
    .addEventListener(
        "click",
        () => {

            showHole(
                currentHoleIndex + 1
            );

        }
    );


// =========================================
// PLUS / MINUS
// =========================================

document
    .querySelectorAll(
        ".score-button"
    )
    .forEach(
        button => {

            button.addEventListener(
                "click",
                () => {

                    const player =
                        button.dataset.player;


                    const action =
                        button.dataset.action;


                    const input =
                        document.getElementById(
                            `score-${player}`
                        );


                    let value =
                        Number(
                            input.value
                        );


                    if (
                        !Number.isFinite(
                            value
                        )
                    ) {

                        const par =
                            Number(
                                document
                                    .getElementById(
                                        "par-value"
                                    )
                                    .textContent
                            );


                        value =
                            Number.isFinite(par)
                                ? par
                                : 1;

                    }


                    if (
                        action === "plus"
                    ) {

                        value++;

                    }


                    if (
                        action === "minus"
                    ) {

                        value--;

                    }


                    value =
                        Math.max(
                            1,
                            Math.min(
                                20,
                                value
                            )
                        );


                    input.value =
                        value;

                }
            );

        }
    );


// =========================================
// SCHLÄGE SPEICHERN
// =========================================

document
    .getElementById("save")
    .addEventListener(
        "click",
        async () => {

            const hole =
                holes[
                    currentHoleIndex
                ];


            let allPlayersEntered =
                true;


            // =================================
            // ALLE DREI SPIELER
            // =================================

            for (
                const player
                of Object.keys(
                    playerColumns
                )
            ) {

                const input =
                    document.getElementById(
                        `score-${player}`
                    );


                const value =
                    Number(
                        input.value
                    );


                if (
                    !Number.isFinite(value) ||
                    value < 1 ||
                    value > 20
                ) {

                    allPlayersEntered =
                        false;

                    continue;

                }


                // =================================
                // WICHTIG:
                // Nur hier wird ein Score
                // tatsächlich als gespielt
                // gespeichert.
                // =================================

                const scoreKey =
                    getScoreKey(
                        hole.round,
                        hole.hole,
                        player
                    );


                playedScores[scoreKey] =
                    value;

            }


            if (!allPlayersEntered) {

                showStatus(
                    "Bitte für alle drei Spieler einen gültigen Score eingeben.",
                    true
                );


                return;

            }


            // =================================
            // SPEICHERN
            // =================================

            // =================================
// LOKAL SPEICHERN
// =================================

localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(
        playedScores
    )
);


// =================================
// SUPABASE SPEICHERN
// =================================

const scoresToSave = [];


for (
    const player
    of Object.keys(
        playerColumns
    )
) {

    const scoreKey =
        getScoreKey(
            hole.round,
            hole.hole,
            player
        );


    scoresToSave.push({

        round:
            hole.round,

        hole:
            hole.hole,

        player:
            player,

        score:
            playedScores[scoreKey]

    });

}


const {
    error
} =
    await supabaseClient
        .from("scores")
        .upsert(
            scoresToSave,
            {
                onConflict:
                    "round,hole,player"
            }
        );


if (error) {

    console.error(
        "Fehler beim Speichern in Supabase:",
        error
    );


    showStatus(
        "Scores konnten nicht online gespeichert werden.",
        true
    );


    return;

}


showStatus(
    `${hole.label} gespeichert.`,
    false
);


            // =================================
            // AUTOMATISCH WEITER
            // =================================

            if (
                currentHoleIndex
                <
                holes.length - 1
            ) {

                setTimeout(
                    () => {

                        showHole(
                            currentHoleIndex + 1
                        );

                    },
                    350
                );

            }

        }
    );

// =========================================
// KOMPLETTES TURNIER ZURÜCKSETZEN
// =========================================

document.getElementById("reset-tournament")
    .addEventListener(
        "click",
        () => {

            const confirmed =
                confirm(
                    "Soll wirklich das komplette Turnier gelöscht werden?"
                );


            if (!confirmed) {

                return;

            }


            // Alle lokal gespeicherten Schläge löschen

            localStorage.removeItem(
                "golfHoleData"
            );

            localStorage.removeItem(
                "golfPlayedScores"
            );


            // Aktuelle Daten im Speicher löschen

            if (
                typeof holeData !== "undefined"
            ) {

                for (
                    const key of Object.keys(holeData)
                ) {

                    if (
                        holeData[key].existingScores
                    ) {

                        holeData[key].existingScores = {};

                    }

                }

            }


            if (
                typeof playedScores !== "undefined"
            ) {

                playedScores = {};

            }


            // Erstes Loch anzeigen

            if (
                typeof showHole === "function"
            ) {

                showHole(0);

            }


            // Status anzeigen

            if (
                typeof showStatus === "function"
            ) {

                showStatus(
                    "Das komplette Turnier wurde zurückgesetzt.",
                    false
                );

            }

        }
    );


// =========================================
// STATUS
// =========================================

function showStatus(
    message,
    error
) {

    const status =
        document.getElementById(
            "status"
        );


    status.style.display =
        "block";


    status.textContent =
        message;


    status.style.background =
        error
            ? "#f3d4d4"
            : "#e6e6e6";

}


// =========================================
// START
// =========================================

initializeSupabase();

loadExcel();

</script>


</body>

</html>
